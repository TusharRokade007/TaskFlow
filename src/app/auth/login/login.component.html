<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="row login-card shadow rounded w-100" style="max-width: 900px;">
    <!-- Left side -->
    <div class="col-md-6 bg-light d-flex flex-column justify-content-center align-items-center p-4 text-center">
      <h1 class="text-primary mb-3">TaskFlow</h1>
      <p class="text-secondary mb-4">Streamline your projects, teams, and productivity.</p>
    </div>

    <!-- Right side -->
    <div class="col-md-6 d-flex flex-column justify-content-center p-5">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <h2 class="mb-3">Login</h2>
        <p class="text-muted mb-4">Access your dashboard</p>

        <div class="form-floating mb-3">
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="name@example.com"
            formControlName="email"
            autocomplete="off"
          />
          <label for="email">Email address</label>
          <div
            *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            class="text-danger small mt-1"
          >
            Please enter a valid email.
          </div>
        </div>

        <div class="form-floating mb-4">
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Password"
            formControlName="password"
            autocomplete="current-password"
          />
          <label for="password">Password</label>
          <div
            *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            class="text-danger small mt-1"
          >
            Password must be at least 6 characters.
          </div>
        </div>

        <button
          type="submit"
          class="btn w-100"
          
        >
          Login
        </button>

        <div class="text-center mt-3">
          <a href="#" class="text-primary">Forgot password?</a>
        </div>
      </form>
    </div>
  </div>
</div>
