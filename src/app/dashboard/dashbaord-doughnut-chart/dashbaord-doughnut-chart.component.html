<div class="task-status-card">
  <h5>Task Status</h5>

  <div class="task-status-content">
    <!-- Doughnut Chart -->
    <div class="chart-wrapper">
      <canvas #doughnutCanvas></canvas>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item">
        <span class="dot" style="background-color: #4C6FFF;"></span>
        <span>Done</span>
        <span class="percent">56%</span>
      </div>
      <div class="legend-item">
        <span class="dot" style="background-color: #FBBF24;"></span>
        <span>In Progress</span>
        <span class="percent">26%</span>
      </div>
      <div class="legend-item">
        <span class="dot" style="background-color: #A78BFA;"></span>
        <span>Pending</span>
        <span class="percent">18%</span>
      </div>
    </div>
  </div>
</div>
